<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <rect width="800" height="350" fill="#ffffff" />
  
  <!-- Domaine Source -->
  <rect x="50" y="50" width="260" height="250" fill="#f8f9fa" stroke="#343a40" stroke-width="2" rx="10" />
  <text x="180" y="80" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">Domaine Source (Général)</text>
  
  <rect x="70" y="110" width="220" height="60" fill="#e9ecef" stroke="#495057" stroke-width="1.5" rx="5" />
  <text x="180" y="135" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">Dataset ImageNet</text>
  <text x="180" y="155" font-family="Arial" font-size="12" text-anchor="middle" fill="#495057">> 1,2 million d'images</text>

  <!-- Down Arrow -->
  <line x1="180" y1="170" x2="180" y2="200" stroke="#343a40" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="70" y="210" width="220" height="60" fill="#e9ecef" stroke="#495057" stroke-width="1.5" rx="5" />
  <text x="180" y="235" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">Réseau Pré-entraîné</text>
  <text x="180" y="255" font-family="Arial" font-size="12" text-anchor="middle" fill="#495057">Ex: Architecture EfficientNet</text>

  <!-- Domaine Cible -->
  <rect x="490" y="50" width="260" height="250" fill="#f8f9fa" stroke="#343a40" stroke-width="2" rx="10" />
  <text x="620" y="80" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">Domaine Cible (Médical)</text>

  <rect x="510" y="110" width="220" height="60" fill="#e9ecef" stroke="#495057" stroke-width="1.5" rx="5" />
  <text x="620" y="135" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">Dataset BUSI</text>
  <text x="620" y="155" font-family="Arial" font-size="12" text-anchor="middle" fill="#495057">780 échographies mammaires</text>

  <!-- Down Arrow -->
  <line x1="620" y1="170" x2="620" y2="200" stroke="#343a40" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="510" y="210" width="220" height="60" fill="#d1e7dd" stroke="#0f5132" stroke-width="1.5" rx="5" />
  <text x="620" y="235" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f5132">Modèle Spécialisé</text>
  <text x="620" y="255" font-family="Arial" font-size="12" text-anchor="middle" fill="#0f5132">Classification du Cancer</text>

  <!-- Transfer Arrow -->
  <path d="M 290 240 L 400 240 L 400 240 L 495 240" fill="none" stroke="#0d6efd" stroke-width="4" marker-end="url(#arrowhead-blue)" />
  <text x="400" y="225" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d6efd">Transfert des Poids</text>
  <text x="400" y="265" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#0d6efd">(Ajustement Fin / Fine-Tuning)</text>

  <!-- Definitions for Arrowheads -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#343a40" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0d6efd" />
    </marker>
  </defs>
</svg>
